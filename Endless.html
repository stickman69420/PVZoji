<!doctype HTML>
<html>
	<head>
		<meta charset="UTF-8">
		<title>PVZ endless mode selection</title>
		<style id="css-output">
			body {
				font-family:arial;
				background-color: #777777;
				margin: 0px;
				padding: 0px;
				font-size: 20px;
			}
			button {
				margin: 0px;
				padding: 0px;
				width: 108px;
				height: 150px;
				position: absolute;
				align-content: center;
				text-align: center;
				color:#00AF0F;
				font-size:50px;
				background-color:#45426A;
				border-color:#222137;
				border-top-color:#8184B8;
				border-style:solid;
				border-width:5px;
			}
			.disp {
				height: 50px;
				top: -70px;
			}
			a {
				box-sizing: border-box;
				-moz-box-sizing: border-box;
				-webkit-box-sizing: border-box;
				display: block;
				margin: 0px;
				padding: 0px;
				width: 100%;
				height: auto;
				align-content: center;
				text-align: center;
				color:#00AF0F;
				background-color:#45426A;
				border-color:#222137;
				border-top-color:#8184B8;
				border-style:solid;
				border-width:5px;
			}
		</style>
	</head>
	<body>
		<a id="returnn" href="./index.html">Return</a>
		<div style="line-height:160px;width:1080px;height:2240px;" id="levels"></div>
		<script>
			addEventListener("error", (e) => {
				alert(e.lineno+": "+e.message+"\nEL")
			});
		</script>
		<script src="./Definitions.js"></script>
		<script>
			function Enter(e) {
				if (localStorage.getItem("end"+e+"sun") != undefined) {
					const lvl = JSON.parse(localStorage.getItem("end"+e+"Level"))
					if (confirm("You have data saved for this level.\nWould you like to resume?")) {
						sessionStorage.setItem("end"+e+"load",true)
						window.location = "./PVZoji.html"
					} else {
						if(confirm("Delete data for this level?")) {
							savedVars.forEach((ee) => {
								localStorage.removeItem("end"+e+ee)
							})
						} else {
							location.reload()
						}
					}
				} else {
					sessionStorage.setItem("Level",[34,74][e])
					sessionStorage.setItem("Endless",e)
					window.location = "./PVZoji.html"
				}
			}
			
			const stylesheet = document.getElementById("css-output").sheet
			let sizePerc = Math.min(window.innerHeight/722,window.innerWidth/1080)
			stylesheet.cssRules[0].style.fontSize = 20*sizePerc+"px"
			stylesheet.cssRules[1].style.fontSize = 50*sizePerc+"px"
			stylesheet.cssRules[1].style.width = 108*sizePerc+"px"
			stylesheet.cssRules[1].style.height = 150*sizePerc+"px"
			stylesheet.cssRules[2].style.height = 50*sizePerc+"px"
			stylesheet.cssRules[2].style.top = -70*sizePerc+"px"
			stylesheet.cssRules[1].style.borderWidth = 5*sizePerc+"px"
			//returnn.style.width = 1080*sizePerc+"px"
			
			addEventListener("resize", (e) => {
				sizePerc = Math.min(window.innerHeight/722,window.innerWidth/1080)
				stylesheet.cssRules[2].style.height = 50*sizePerc+"px"
				stylesheet.cssRules[2].style.top = -70*sizePerc+"px"
				stylesheet.cssRules[0].style.fontSize = 20*sizePerc+"px"
				stylesheet.cssRules[1].style.fontSize = 50*sizePerc+"px"
				stylesheet.cssRules[1].style.width = 108*sizePerc+"px"
				stylesheet.cssRules[1].style.height = 150*sizePerc+"px"
				stylesheet.cssRules[1].style.borderWidth = 5*sizePerc+"px"
				//returnn.style.width = 1080*sizePerc+"px"
				Array.from(document.getElementsByClassName("seed")).forEach((eee,ee) => {
					eee.style.left = 108*(ee%10)*sizePerc+"px"
					eee.style.top = returnn.offsetHeight+150*Math.floor(ee/10)*sizePerc+"px"
				})
				Array.from(document.getElementsByClassName("seedDisp")).forEach((ee) => {
					/*ee.style.fontSize = ee.dataset.originalSize*sizePerc+"px"
					ee.style.top = ee.dataset.originalTop*sizePerc+"px"
					ee.style.left = ee.dataset.originalLeft*sizePerc+"px"*/
					ee.style.height = 98*sizePerc+"px"
					ee.style.width = 98*sizePerc+"px"
				})
			})
			const endles = ["vase","last stand"]
			endles.forEach((e,ee) => {
				levels.innerHTML += "<button class='seed' onclick='Enter("+ee+")' style='left:"+108*(ee%10)+"px;top:"+150*Math.floor(ee/10)+"px;'><img class='disp' src='./images/ui/"+e+".png'></button>"
			})
			Array.from(document.getElementsByClassName("seed")).forEach((eee,ee) => {
				eee.style.left = 108*(ee%10)*sizePerc+"px"
				eee.style.top = returnn.offsetHeight+150*Math.floor(ee/10)*sizePerc+"px"
			})
			Array.from(document.getElementsByClassName("seedDisp")).forEach((ee) => {
				/*ee.style.fontSize = ee.dataset.originalSize*sizePerc+"px"
				ee.style.top = ee.dataset.originalTop*sizePerc+"px"
				ee.style.left = ee.dataset.originalLeft*sizePerc+"px"*/
				ee.style.height = 98*sizePerc+"px"
				ee.style.width = 98*sizePerc+"px"
			})
		</script>
	</body>
</html>
