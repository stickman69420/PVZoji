<!doctype HTML>
<html>
	<head>
		<script>
			addEventListener("error", (e) => {
				alert(e.lineno+":"+e.colno+", "+e.message+"\nMain")
			});
		</script>
		<meta charset="utf-8">
		<style>
			a {
				box-sizing: border-box;
				-moz-box-sizing: border-box;
				-webkit-box-sizing: border-box;
				display: block;
				margin: 0px;
				padding: 0px;
				width: 100%;
				height: auto;
				align-content: center;
				text-align: center;
				color:#00AF0F;
				background-color:#45426A;
				border-color:#222137;
				border-top-color:#8184B8;
				border-style:solid;
				border-width:5px;
			}
		</style>
	</head>
	<body>
		<a id="returnn" href="./index.html">Return</a>
		<div id="Sel"></div>
		<!--button id="stco" style="text-shadow: 0 0 1px black"><b>START</b></button-->
		<script src="Definitions.js"></script>
		<script>
			//stco.innerHTML = "<b>"+(RogueRun ? "CONTINUE" : "START")+"</b>"
			
			function Enter(e,r) {
				if (localStorage.getItem("survival"+e+","+r+"sun") != undefined) {
					const lvl = JSON.parse(localStorage.getItem("survival"+e+","+r+"Level"))
					if (confirm("You have data saved for this level.\nWould you like to resume?")) {
						sessionStorage.setItem("survival"+e+","+r+"load",true)
						window.location = "./PVZoji.html"
					} else {
						if(confirm("Delete data for this level?")) {
							savedVars.forEach((ee) => {
								localStorage.removeItem("survival"+e+","+r+ee)
							})
						} else {
							location.reload()
						}
					}
				} else {
					sessionStorage.setItem("Level",8+10*r)
					sessionStorage.setItem("SurvivalA",e)
					sessionStorage.setItem("SurvivalB",r)
					window.location = "./PVZoji.html"
				}
			}
			
			for (let i=0;i<4;i++) {
				Sel.insertAdjacentHTML("beforeend",'<div id="SelI'+i+'"></div>')
				for (let j=0;j<AreaBg.length;j++) {
					document.getElementById("SelI"+i).insertAdjacentHTML("beforeend",'<button id="button'+i+j+'" onclick="Enter('+i+','+j+')" style="text-shadow: 0 0 1px '+["black","red","black","red"][i]+'"><b>'+AreaName[j]+' Survival '+["","(Hard)","(Endless)","(Hard, Endless)"][i]+'</b></button>')
				}
				Sel.insertAdjacentHTML("beforeend",'<br>')
			}
		</script>
	<body>
</html>
