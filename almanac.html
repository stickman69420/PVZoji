	<body style="width:100%;height:100%;margin:0px;padding:0px;background-color:#F2B67B;">
		<a id="returnn" href="./index.html">Return</a>
		<div id="plantsA" class="big" style="float:left;">
		</div>

		<e id="panel" style="border:2px solid black;background-color:#FDBA75;position:absolute;width:auto;height:auto;visibility:hidden;left:440px;" data-top="-1"></e>

		<script>
			addEventListener("error", (e) => {

		<script>
			//Resize initially
			const stylesheet = document.getElementById("css-output").sheet
			let sizePerc = Math.min(window.innerHeight/722,window.innerWidth/1080)
			stylesheet.cssRules[2].style.height = /*Math.ceil*/(150*sizePerc)+"px"
			stylesheet.cssRules[0].style.borderWidth = /*Math.floor*/(5*sizePerc)+"px"
			stylesheet.cssRules[0].style.fontSize = /*Math.floor*/(16*sizePerc)+"px"
			stylesheet.cssRules[0].style.lineHeight = /*Math.floor*/(16*sizePerc)+"px"
			stylesheet.cssRules[5].style.width = 26*sizePerc+"px"
			stylesheet.cssRules[5].style.borderWidth = 5*sizePerc+"px"
			stylesheet.cssRules[5].style.fontSize = 12*sizePerc+"px"

			//panel.style.width = 200*sizePerc+"px"
			panel.style.left = (540-panel.offsetWidth/2)*sizePerc+"px"
			panel.style.borderWidth = 2*sizePerc+"px"
			
			addEventListener("resize", (ee) => {
				sizePerc = Math.min(window.innerHeight/722,window.innerWidth/1080)
				stylesheet.cssRules[2].style.height = /*Math.ceil*/(150*sizePerc)+"px"
				stylesheet.cssRules[0].style.borderWidth = /*Math.floor*/(5*sizePerc)+"px"
				stylesheet.cssRules[0].style.fontSize = /*Math.floor*/(16*sizePerc)+"px"
				stylesheet.cssRules[0].style.lineHeight = /*Math.floor*/(16*sizePerc)+"px"
				stylesheet.cssRules[5].style.width = 26*sizePerc+"px"
				stylesheet.cssRules[5].style.borderWidth = 5*sizePerc+"px"
				stylesheet.cssRules[5].style.fontSize = 12*sizePerc+"px"
				//panel.style.height = 100*sizePerc+"px"
				//panel.style.width = 200*sizePerc+"px"
				panel.style.left = (540-panel.offsetWidth/2)*sizePerc+"px"
				panel.style.borderWidth = 2*sizePerc+"px"
				panel.style.top = (Number(panel.dataset.top)+50-panel.offsetHeight/2)*sizePerc+returnn.offsetHeight+"px"
				Array.from(document.getElementsByClassName("adjust")).forEach((e) => {
					e.style.fontSize = /*Math.floor*/(e.dataset.originalSize*sizePerc)+"px"
				})
			})
			const plantsDesc = ["Shoots peas at the zombies","Makes sun","Explodes with a short fuse","Blocks zombies","Takes some time to arm and then blows up when a zombie steps on it","Freezes zombies on its tile and can upgrade some plants to inflict cold and sometimes freeze","Eats small-medium zombies and rapidly bites big zombies","Shoots two peas at the zombies","Same damage as a peashooter but with less range","Makes small sun but can upgrade to normal sun later","Fumes can bypass shields and pierce through crowds","Destroys graves","Turns a zombie to your side","Cheap peashooter that hides when zombies are REALLY close","Freezes all zombies on screen","Blows up a large area and leaves a crater","Allows other plants to be placed on water","Squashes all zombies in one tile","Shoots peas into adjacent lanes as well. Peas on the edge bounce","Kills one water zombie","Incinerates the whole lane and melts ice","Deals rapid damage that bypasses shields and can destory vehicles instantly","Unleashes 3 circular barrrages of fire. Can upgrade some plants to deal double damage and thaw","Blocks jumping zombies and has high health","Puff shroom but wet. Has a longer recharge than puff shroom but shorter than the original game","Clears fog","Pops balloons. Fires slightly faster than the original and can pierce","Kills all flying zombies and clears fog. Disappears after 24 seconds rather than 2 so you can place on top of it","Fires 2 peas backwards and 1 forward","Fires in 5 directions. Fires constantly since line detection are difficult, okay?","Protects plants without taking up extra space","Steals metal objects","Double the damage of a peashooter but half the firerate","Allows other plants to be planted on the roof","Same damage as a peashooter but half the firerate. High chance to butter","Wakes up sleeping fungi","Diverts zombies onto other lanes","Blocks invisible basketballs and bungees around itself","Fires three rolling electricity balls that can levitate over inclines and bounce","Launches heavy damage melons with splash damage","Fires a lot of peas","Makes more sun and is cheaper than the original game","Deals HEAVY damage in a 3x3","Homes in on zombies (can also shoot vertically)","Automatically grabs sun","Slows and sometimes freezes as well, like snow pea","Allows you to put water plants in the wrong place","Can be crushed multiple times and deals more damage"]
			const specStats = {6:"Bite damage: 40/1s<br>Chomp damage: 1800/42s",27:"Lasts 24s<br>Can place on top of",31:"Steals 1/24s",34:"Butter: 5s/25%",37:"Block: 3x3"}
			const plantsExt = ["Peashooter loves to fire peas. No one knows why but it's useful","Sunflower loves to produce sun. Everyone knows why and it's very useful","Cherry bomb actually has 2 PHDs","Some wall nuts can't actually feel the zombies eating them. This one can","All other potato mines spend all their time evaluating their decisions. This mine spends all its time procrastinating but still gets the job done (mostly)","Iceberg lettuce does know why it's suddenly here but it blames time travel. It's also a fan of this whole \"upgrading\" thing","Tried going into hollywood after seeing another chomper succeed in a film but it just didn't have the experience","Repeater loves to fire two peas. Some know why and it's very useful","Puff shroom comes from a very big family. Every puff shroom does. Some say they're all one but puff shroom doesn't believe it","Sun shroom has changed its mind. Sun is actually great and he loves to give it to other plants. Its brother doesn't agree","Fume shroom dislikes country music. That's all he would say for some reason","Someone once asked Grave buster whether he was stone or wood. He was confused since he's literally a log. He didn't know about the other Grave buster","Not a psycadelic drugs reference. Nope. This is a PG game. No drugs. None of them. Not a single drugs anywhere","Scaredy shroom is a bit sensitive about it so please don't mention it. It's actually a fairly normal size. His eye is also large but he's come to accept that","Ice shroom had some reconstructive surgery a while ago but still can't stop frowning. This is because he's the only plant that they interviewed twice","A failed zombie experiment and a night of incompetence were the origin of this Doom shroom. It will destroy","Lily pad hates having other plants on top of him but he understands it's for the greater good and refuses to complain","Squash runs a massage parlor and an accountancy office at the same time. That's just how good he is at relaxing people and handling finances","Threepeater hates to fire three peas and can't stop. No one knows why but it's useful","Tangle kelp enjoys the feel of zombie skin getting punctured by thorns and them dragged down kicking and screaming. He doesn't get invited places","Jalapeño cannot tolerate any spice. Not even pepper","Spikeweed isn't a fan. He just isn't. Nothing excites him enough for that. Sure, he enjoys certain creators better than others but not really a fan of any","Torchflame lettuce doesn't mind if you accidentally deadname them. They understand","Tall nut believes himself superior to all Wall nuts. This is true.","Sea shroom tried going out with Puff shroom for a while but it just never worked out. They're still friends to this day though","Plantern once got an incantation wrong and transformed light into dark. That was a dark time","Cactus has never been happier. It's as simple as that. Cactus finally found its place in the world. Popping balloons and piercing crowds","Blover once accidentally blew over a tree. No one has looked at him the same since","Split pea hates to fire three peas and can't stop. Everyone knows why but it's useful","Starfruit is just too excitable to stop. Starfruit always plays ranger and is the best in his local area. These facts are unrelated","Pumpkin isn't a fan of peggle. He has a first cousin once removed who's kinda famous from it but he just can't get into it","Magnet shroom can barely resist sucking in your lawnmowers. He's ready. He also has 239 years in jail if they catch him","Cabbage pult doesn't get along with the lettuces. He doesn't like their popularity","Flower pot is jealous of Flower pot's sprout. He's tried long and hard but he just can't grow one","Kernel pult constantly forgets Cabbage and Melon pult's birthdays despite his best efforts","Coffee bean hasn't slept in 5 days and is starting to feel like he can't move","Garlic likes being eaten. The zombies' bites barely hurt and the looks on their faces is worth it","Umbrella leaf's real name is George but no one ever bothers to learn it","Don't try to fool Lightning lettuce. They weren't born yesterday. Well they were but they know a lot","Melon pult once tried to throw Cabbage pult. It didn't go well","Gatling pea hates to fire four peas and can't stop. Some people know why but it's useful","Twin sunflower's heads have opposing opinions on producing large suns. Everyone is quantumly superpositioned to understand and not simultaneously","Gloom shroom dislikes it when you refer to it releasing heavy fumes as \"glooming it\"","\"Mrow :3,\" says Cattail, for it has been on the internet too much","Sun magnet doesn't like it when you compare him to Gold magnet. He is simply too far superior","Winter melon's frozen exterior is a reflection of his cold, dead, heart","Water pot says \"bubble\" all day long because it enjoys onomatopoeia","Spikerock likes being crushed. No one knows why but they all kinda look away when it happens"]
			plantsDesc.forEach((e,ee) => {
				let stats = "Recharge: "+Recharges[ee]+"s<br>Cost: "+cost[ee]+(special[ee].extra ? "/"+special[ee].extra : "")+"<br>"
				if (special[ee].proj) {
					stats += "Damage: "+value[ee]+(value[ee] > 0 ? ("/"+fireRate[ee]+"s<br>") : "<br>")
					if (special[ee].count) stats += special[ee].count+" shots<br>"
					if (CollBox[ee][0] >= 100 || CollBox[ee][1] >= 100) {
						stats += "Size: "+CollBox[ee][0]/100+"x"+CollBox[ee][1]/100+"<br>"
					}
				} else if (special[ee].sun) {
					stats += "Sun: "+value[ee]+"/"+fireRate[ee]+"s<br>"
				}
				if (plantHealth[ee] != 300 && (special[ee].selfD ?? 0) == 0) stats += "Health: "+plantHealth[ee]+"<br>"
				if (special[ee].ice) stats += "Freeze time: "+special[ee].ice.dur/1000+"s<br>"
				if (special[ee].snow) stats += "Cool time: "+special[ee].snow/1000+"s<br>"
				if (special[ee].pen) stats += "Penetration: "+special[ee].pen+"<br>"
				if (special[ee].pult) stats += "Pult: "+special[ee].pult+"<br>"
				if (special[ee].range != undefined && special[ee].range < 9 && special[ee].range > 0) stats += "Range: "+(special[ee].negRange != undefined && special[ee].negRange > -9 ? -special[ee].negRange+"/" : "")+special[ee].range+"<br>"
				if (plantHealth[ee]-(special[ee].selfD ?? 0) === 0) stats += "Single use<br>"
				else if ((special[ee].selfD ?? 0) != 0) stats += Math.ceil(plantHealth[ee]/(special[ee].selfD ?? 0))+" uses<br>"
				if (special[ee].light) stats += special[ee].light[0]+"x"+special[ee].light[1]+" fog clearing<br>"
				stats += specStats[ee] ?? ""
				let newstats = ""
				stats.split("<br>").forEach((e) => {
					newstats += "<e class='adjust' data-original-size='"+Math.min(16,16*(15/e.length))+"' style='font-size:"+Math.min(16*sizePerc,16*sizePerc*(15/e.length))+"px'>"+e+"<br></e>"
				})
				plantsA.insertAdjacentHTML("beforeend","<div class='med'><img src='./images/plants/"+plants[ee]+".png'><div class='stats'>"+newstats+"</div>"+(special[ee].UpgradeType != undefined ? "<button id='upgrade"+ee+"' onclick='openPanel("+ee+")'>Upgrade</button>" : "")+e+"<div class='bel'>"+plantsExt[ee]+"</div></div>")
			})
			const zombsDesc = ["The most basic zombie","Signals a horde approaching","The cone on his head somehow cannot be bypassed","Leaps over the first plant he encounters","The bucket on his head also can't be bypassed","Runs really fast after you break his paper","Door, while not screen, has the same health and properties of a screen door","The football on his head also cannot be bypassed","Summons backup dancers every 3 seconds. All dancers in the same group move at the same speed","Tiny bit faster and weaker than a basic zombie","Straight shooting plants can't hit it unless it's eating","High health, crushes plants, slows down over time, and leaves ice trails behind","Spawns every 13 seconds from ice trails. Releases 4 bobsled zombies when destroyed","Basically a basic zombie","Wet and fast pole vaulter","Explodes semi-randomly and destroys most plants in a 3x3","Can't be hit by most plants until you hit its balloon","Digs under your defences and destroys them from behind","Jumps over all your plants","Steals a random plant","Has high front armor and can allow all zombies to bypass the first plant he encounters","Snipes your back plant using an invisible basketball","Crushes everything "]
			const zombSpecStats	= {16:"Can't swim after balloon pops"}
			const zombExt = ["This zombie actually dislikes brains but just goes along with it","Flag zombie found the flag sticking out of a random bin and decided to keep it","Conehead's favourite colour is yellow so he spray painted his cone","Pole vaulter managed to win first in the nationals twice","Some claim that Buckethead's bucket is just spray painted metallic white. It is. Magnets only work on the handle","Newspaper zombie gave up on sudokus and switched to crosswords but still can't finish them in time","The wood on the door is actually just painted cardboard. Underneath is a real screen door","For some reason the people in this town value their sports players enough to invest in titanium helmets","Dancing zombie is dancing dangerously close to a lawsuit... if anyone cared at least","Backup dancer walked in here by accident","Snorkel zombie took some time to repair its snorkel mask but no one seems to care","Zomboni is also dangerously close to a lawsuit if anyone cared but this time it's even closer","Bobsled team is just four zombies hanging out on a piece of metal","Bobled zombie doesn't really know what to do without the rest of his team","The dolpin is always a zombie as well","This zombie doesn't shiver because he knows exactly what must be done","Balloon zombie is somehow still the only zombie who tried out flying and is still happy about it","Digger zombie has given up filing excavation permits and has lost his licence","Pogo zombie spent 7 years trying to convince the other zombies that a pogo was a useful purchase. They still don't believe him","Bungee zombie is not in jail only because zombies don't have a legal system yet","He picked up the ladder for $12.99. He still can't believe inflation has really hit this hard","Catapult zombie really regrets building a catapult that can only launch invisible basketballs. They're way too hard to buy"]
			zombsDesc.forEach((e,ee) => {
				let stats = "Health: "+ZombHealth[ee]+"<br>Speed: "+SpdRng[ee][0]+"-"+SpdRng[ee][1]+"t/s<br>"
				if (ZombSpecial[ee].pool) stats += "Can swim<br>"
				if (ZombSpecial[ee].pool == 2) stats += "Can't walk<br>"
				if (ZombSpecial[ee].jump) stats += "Jumps<br>Speed after jump: "+ZombSpecial[ee].AfterSpd[0]+"-"+ZombSpecial[ee].AfterSpd[1]+"t/s<br>"
				if (ZombSpecial[ee].shields) for (const [key,value] of Object.entries(ZombSpecial[ee].shields)) {
					const t = ZombSpecial[ee].transform.break
					stats += key+" shield: "+value+(t ? "<br>Speed after break: "+t.speed[0]+"-"+t.speed[1]+"t/s" : "")+"<br>"
				}
				if (ZombSpecial[ee].spawn) stats += "Summons: "+{9:"backup dancer"}[ZombSpecial[ee].spawn]+" x"+ZombSpecial[ee].pattern.length+"<br>"
				if (ZombSpecial[ee].metal) stats += "Weak to magnet<br>"
				if (ZombSpecial[ee].ammo > 0) stats += "Ammo: "+ZombSpecial[ee].ammo+"<br>"
				stats += zombSpecStats[ee] ?? ""
				let newstats = ""
				stats.split("<br>").forEach((e) => {
					newstats += "<e class='adjust' data-original-size='"+Math.min(16,16*(15/e.length))+"' style='font-size:"+Math.min(16*sizePerc,16*sizePerc*(15/e.length))+"px'>"+e+"<br></e>"
				})
				zombiesA.insertAdjacentHTML("beforeend","<div class='med'><img src='./images/zombies/"+["base","flag","cone","pole","bucket","newspaper","door","football","dancer","backup dancer","snorkel","zomboni","bobsled team","bobsled","dolphin","box","balloon","pickaxe","pogo","rope","ladder","catapult"][ee]+".png'><div class='stats'>"+newstats+"</div>"+e+"<div class='bel'>"+zombExt[ee]+"</div></div>")
			})
			
			Array.from(document.getElementsByClassName("adjust")).forEach((e) => {
				e.style.fontSize = Math.floor(e.dataset.originalSize*sizePerc)+"px"
			})
			function openPanel(p) {
				if (panel.dataset.top != 150*p || panel.style.visibility == "hidden") {
					panel.dataset.top = 150*p
					panel.innerHTML = "Plants: "+{5:"Peashooter, Repeater, Threepeater, Split pea",22:"Peashooter, Repeater, Threepeater, Split pea",38:"Peashooter, Repeater, Threepeater, Split pea",40:"Repeater (non-elemental)",41:"Sunflower",42:"Fume shroom",43:"Lily pad",44:"Magnet shroom",45:"Melon pult",46:"Pot",47:"Spikeweed"}[p]//+"<br>Effects: <br>"+(((special[p].upgradeSpec ?? {}).ice ? "Freeze: "+special[p].upgradeSpec.ice.dur/1000+"s/"+special[p].upgradeSpec.ice.chance*100+"%<br>" : "")+((special[p].upgradeSpec ?? {}).snow ? "Cool: "+special[p].upgradeSpec.snow/1000+"s" : "")+((special[p].upgradeSpec ?? {}).incend ? "Incendiary: true<br>" : ""))+((special[p].upgradeSet ?? {}).value ? "Damage: "+special[p].upgradeSet.value+"<br>" : "")+((special[p].upgradeSpec ?? {}).explode ? "Explosion: "+(special[p].upgradeSpec.explode[0]/100)+"x"+(special[p].upgradeSpec.explode[1]/100)+","+(special[p].upgradeSpec.explode[2])+"<br>" : "")+((special[p].upgradeSpec ?? {}).pen ? "Penetration: "+special[p].upgradeSpec.pen+"<br>" : "")+((special[p].upgradeSpec ?? {}).pult ? "Pult: "+special[p].upgradeSpec.pult+"<br>" : "")
					panel.innerHTML += "<br>"+{5:"Cool: 4.5s<br>Freeze: 3.75s/10%",22:"Incendiary: true<br>Damage: 25<br>Splash: 1x1,15",38:"Penetration: Infinite",40:"Count: 4",41:"Sun: 50",42:"Range: 3x3<br>Count: 4",43:"Count: 2<br>Homing: true<br>Damage: 20/1.5s",44:"Range: Infinite<br>Night: false",45:"Splash: 1x3,58<br>Cool: 4.5s<br>Freeze: 3.75s/10%",46:"Plant water plants on top",47:"Damage: 40/1s<br>Tyre pops: 9<br>Gargantuar crush: 3"}[p]
					panel.style.visibility = "visible"
					panel.style.left = (540-panel.offsetWidth/2)*sizePerc+"px"
					panel.style.top = (Number(panel.dataset.top)+50-panel.offsetHeight/2)*sizePerc+returnn.offsetHeight+"px"
				} else {
					panel.style.visibility = "hidden"
				}
			}
		</script>
	</body>
