			function lanePick(z) {
				let vlid = []

						vlidrows.push(0,1,4,5)

						vlidrows.push(2,3)

					if (e.stun > 0) {
						e.vx = 0
						e.stun -= 0.1
						if (e.spec.linked != undefined) {
							let z = Hypnos.find((ee) => ee.id === e.spec.linked)
							if (z) {
								let spd = z.spec
								if (spd.groupSpd > 0) {
									spd.groupSpd = 0
								}
							}
						}
					} else {
						e.vx = e.ovx
					}
					Zombies.forEach((ee) => {
						if(Math.floor(e.x/100)==Math.floor(ee.x/100) && Math.floor(e.y/100)==Math.floor(ee.y/100)) {
							if (e.spec.jump) {
								e.x = Math.ceil(e.x/100)*100+1
								e.ovx = Math.random()*(e.spec.AfterSpd[1]-e.spec.AfterSpd[0])+e.spec.AfterSpd[0]
								e.spec.jump = false
								e.spec.action = false
							} else {
								if ((ee.spec.shields ?? {}).front != undefined && ee.spec.shields.front > 0) {
									ee.spec.shields.front -= 10
									if (ee.spec.shields.front <= 0) {
										for (const [key, value] of Object.entries(ee.spec.transform[Zombs[ee.type].shields.front.break] ?? {})) {
											if (key == "speed") {
												ee.ovx = -(Math.random()*(value[1]-value[0])+value[0])
											} if (key == "spec") {
												for (const [key2, value2] of Object.entries(key)) {
													ee.spec[key2] = value2
												}
											} else {
												ee[key] = value
											}
										}
									}
								} else {
									if (zombInWave.includes(ee.id)) {
										WaveHealth -= Math.min(ee.health, 10)
									}
									ee.health -= 10
								}
								e.vx = 0
								if (e.spec.linked != undefined) {
									let z = Hypnos.find((eee) => eee.id === e.spec.linked)
									if (z) {
										let spd = z.spec
										if (spd.groupSpd > 0) {
											spd.groupSpd = 0
										}
									}
								}
							}
						}
					})
				})
				WaveTime -= 0.1
				if ((WaveHealth <= WaveHealthO/2 || Level==14) && WaveTime > (Level==14 ? 5 : 2)) {
					WaveTime = Level==14 ? Math.random()*5 : 2
				}
				if (WaveHealth == 0 && Level == 14 && WaveTime > 1) {
					WaveTime = Math.random()
				}
				if (WaveTime <= 0) {
					if (Zombies.length == 0 || !(Wave == Waves[+Hard][Level].length || Waves[+Hard][Level][Wave].guaranteed.includes(1) || Waves[+Hard][Level][Wave].guaranteed.includes(25))) {
						//alert(Wave+","+Waves[+Hard][Level].length)
						if ((zSpawn && Wave == Waves[+Hard][Level].length) || (Zombies.length==0 && Obstacles.length==0 && !zSpawn)) {
						if (!vase) {
							//Win
							Wave++
							WaveTime = 1000
							let monCol = 0
							Proj.forEach((e) => {
								if (e.spec.money) monCol += e.value
							})
							localStorage.setItem("money",Number(localStorage.getItem("money"))+monCol)
							alert("🏆\n"+monCol+" dropped money was collected automatically")
							if (!LevsUnlocked.includes(Number(Level)+1)) {
								if (Level == 33) localStorage.setItem("money",Number(localStorage.getItem("money"))+1000)
								LevsUnlocked.push(Number(Level)+1)
								localStorage.setItem("Levs",JSON.stringify(LevsUnlocked))
								if (Unlocks[Number(Level)+1] >= 0) unlocked.push(Unlocks[Number(Level)+1])
								if (unlocked.indexOf(Math.max(...unlocked)) != unlocked.length-1) {
									let t = []
									let t2 = [...unlocked]
									unlocked.forEach(() => {
										t.push(Math.min(...t2))
										t2.splice(t2.indexOf(t[t.length-1]),1)
									})
									unlocked = t
								}
								localStorage.setItem("Unlocked",JSON.stringify(unlocked))
							}
							savedVars.forEach((e) => {
								localStorage.removeItem(e)
							})
							window.location= "./LevelSelect.html"
						} else {
							vase--
							Lawn = []
							do {
								Obstacles = []
								for (let i=0;i<rows;i++) {
									for (let j=3;j<9;j++) {
										//const isp = Math.random() < 0.1
										const ty = /*isp ? true : */Math.random() < 0.5
										Obstacles.push({"img":/*isp ? "plant vase" : */"vase","id":Oid,"col":j,"row":i,"type":2,"sumtype":ty,"summon":ty ? [0,5,7,12,17][Math.floor(Math.random()*5)] : [0,4,7,8,0,4,7][Math.floor(Math.random()*7)]})
										Oid++
									}
								}
							} while (Obstacles.filter((o) => o.type==2 && o.sumtype).length <= 15)
							for (let i=0;i<5;i++) {
								let ofilt = Obstacles.filter((o) => o.type==2 && o.sumtype && o.img == "vase")
								ofilt[Math.floor(Math.random()*ofilt.length)].img = "plant vase"
							}
							alarm.innerHTML = "A NEW WAVE OF VASES IS APPROACHING"
							alarm.style.fontSize = 35*sizePerc+"px"
							alarm.style.left = 15*sizePerc+"px"
							alarm.style.top = 300*sizePerc+"px"
							setTimeout((e) => {
								alarm.innerHTML = e ? "FINAL WAVE" : ""
								if (!alarm.innerHTML.includes("FINAL")) {
									alarm.style.fontSize = 35*sizePerc+"px"
									alarm.style.left = 15*sizePerc+"px"
									alarm.style.top = 300*sizePerc+"px"
								} else {
									alarm.style.fontSize = 70*sizePerc+"px"
									alarm.style.left = 193*sizePerc+"px"
									alarm.style.top = 287*sizePerc+"px"
								}
							},2000,vase==0)
							if (vase==0) {
								setTimeout(() => {
									alarm.innerHTML = ""
								},4000)
							}
						}
						} else if (zSpawn) {
							WaveTime = 27
							//alert(JSON.stringify(Waves[+Hard][Level][Wave]))
							SpawnWave(Waves[+Hard][Level][Wave].points,Waves[+Hard][Level][Wave].guaranteed,(Waves[+Hard][Level][Wave].ambush ?? []))
							Wave++
						}
					}
				}
				Zombies.filter(e => e.spec.links != undefined).forEach((e) => {
					if (e.vx > e.spec.groupSpd) e.spec.groupSpd = e.vx
					e.vx = e.spec.groupSpd
					e.spec.links.forEach((ee) => {
						const linkedZ = Zombies.find((eee) => eee.id === ee)
						if (linkedZ) linkedZ.vx = e.spec.groupSpd
						/*if (linkedZ && linkedZ.vx > e.vx) {
							e.vx = linkedZ.vx
						} else if (linkedZ && linkedZ.vx < e.vx) {
							linkedZ.vx = e.vx
						}*/
					})
				})
				Hypnos.filter(e => e.spec.links != undefined).forEach((e) => {
					if (e.vx < e.spec.groupSpd) e.spec.groupSpd = e.vx
					e.vx = e.spec.groupSpd
					e.spec.links.forEach((ee) => {
						const linkedZ = Hypnos.find((eee) => eee.id === ee)
						if (linkedZ) linkedZ.vx = e.spec.groupSpd
						/*if (linkedZ && linkedZ.vx > e.vx) {
							e.vx = linkedZ.vx
						} else if (linkedZ && linkedZ.vx < e.vx) {
							linkedZ.vx = e.vx
						}*/
					})
				})
			},100)
			
			if (Object.keys(conveyors).includes(Level)) setTimeout(convey,4000)
			
			function convey() {
				if (selected.length < SeedC && Level != 34) {
					let pool = []
					conveyors[Level].forEach((e) => {
						if (selected.filter(ee => ee == e).length >= 4) {
							pool.push(...Array(36).fill(e))
						} else if (lastPlant == e) {
							pool.push(...Array(500).fill(e))
						} else {
							pool.push(...Array(1000).fill(e))
						}
					})
					//Debug.innerHTML = pool.filter(e => e==2).length+","+pool.filter(e => e==3).length
					lastPlant = pool[Math.floor(Math.random()*pool.length)]
					selected.push(lastPlant)
					seeds.innerHTML = ""
					reloadSeed()
				}
				setTimeout(convey,4000+(selected.length > 2 ? 500 : 0)) //Idk man I searched for an entire day and didn't find an answer. I tried measuring it manually and it was very inconsistent because of human error so I'm guessing half a second which is so inconsequential that I don't even know why I'm adding it
			}
			
			if (!Object.keys(conveyors).includes(Level) && Level%20 < 10) setInterval(() => {
				Proj.push({"id":Pid,"x":Math.random()*800,"y":0,"type":1,"vx":0,"vy":1,"size":75,"img":preloadedImg[4],"spec":{"sun":true,"sky":true,"lifespan":Math.round(Math.random()*500),"Threshold":-900},"value":25})
				Pid++
			},10000)
			}
		</script>
	</body>
</html>
