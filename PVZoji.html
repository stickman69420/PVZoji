/** RegEx that match any number of any characters */
function RegExDistance(number_of_characters) {
  return '.{' + number_of_characters + '}'
}
/** 
 * Find all the matches of pattern over a string, including overlappng matches
 * - pattern: Regular Expression
 * - str: the string to find matches
 * - [Optional] filterFn: Reject matches that the filter returns falsy
 */
function matchAll(pattern, str, filterFn) {
  var results = [], match;
  pattern.lastIndex = 0
  /** Keeps matching until no match */
  while( (match = pattern.exec(str)) != null ) {
    /** Filter the match if needed */
    if ( !filterFn || filterFn(match) ) {
      results.push(match)
    }
    pattern.lastIndex = match.index + 1
  }
  return results;
}
/** 
 * Find the first match of pattern over a string
 * - pattern: Regular Expression
 * - str: the string to find matches
 * - filterFn: Reject matches that the filter returns falsy
 * There are no reason to use this function if you don't have a fileterFn
 */
function matchOne(pattern, str, filterFn) {
  var match;
  pattern.lastIndex = 0
  /** Keeps matching until no match */
  while( (match = pattern.exec(str)) != null ) {
    /** Filter the match */
    if ( filterFn(match) ) {
      return match;
    }
    pattern.lastIndex = match.index + 1
  }
  return null;
}
/**

/** 
 * Build Detect Matches on a Row for an array of gem types
 * ie. `/AAA|BBB|CCC/`
 */
function RegExMatchesRow(types) {
  return new RegExp(
    types.map(
      /** Expression for each type `T` */
      function(T) {
        return [T, T, T].join('');
      }
    ).join('|'),
    'g'
  )
}
/**
 * Returns a filter function to reject matches that have 
 * index less than 3 cells from the end of the row
 * 
 * See Issue 1 in 'Detect Matches on a Row' section at
 * http://bit.ly/2laynF5
 * 
 */
function MatchesRowFilterCreator(number_of_cols) {
  return function(match) {
    /** Reject if no match found */
    if (match == null) return false;
    /** Distance from the match index to end of row */
    var distance_to_EOR = number_of_cols - match.index % number_of_cols;
    /** Rerturn true if match index is more than 2 cells from the end of row */
    return distance_to_EOR > 2;
  }
}
/** Returns the indices of gems to be removed from Matches on Row */
function ExtractIndicesMatchesRow(match) {
  var index = match.index;
  return [index, index + 1, index + 2];
}
/**
 * DETECT MATCHES ON A COLUMN
 * ==========================
 */
/** 
 * Build Detect Matches on a Column for an array of gem types
 * 
 * ie.
 * 0T00
 * 0T00
 * 0T00
 * 
 * /T.{3}T.{3}T/
 */
function RegExMatchesCol(number_of_cols, types) {
  var distance = RegExDistance(number_of_cols - 1);
  
  return new RegExp(
    types.map(
      /** Expression for each type `T` */
      function(T) {
        return [T, distance, T, distance, T].join('');
      }
    ).join('|'),
    'g'
  )
}
/** 
 * Returns a function that returns 
 * the indices of gems to be removed from Matches on Column
 */
function ExtractIndicesMatchesColCreator(number_of_cols) {
  return function(match) {
    var index = match.index;
    return [index, index + number_of_cols, index + 2 * number_of_cols];
  }
}
/**
 * DETECT POTENTIAL MATCHES ON A ROW
 * =================================
 */
/** 
 * Build Detect Potential Matches on a Row for an array of gem types
 * With swappable gem is on the row below
 */
function RegexPotentialMatchesRow(number_of_cols, types) {
  var distance1 = RegExDistance(number_of_cols - 1),
    distance2 = RegExDistance(number_of_cols - 1),
    distance3 = RegExDistance(number_of_cols - 1);
  
  return new RegExp(
    types.map(
      /** Expression for each type `T` */
      function(T) {
        return [
          [ T, T, '.', distance1, T ].join(''),
          [ T, '.', T, distance2, T ].join(''),
          [ '.', T, T, distance3, T ].join('')
        ].join('|')
      }
    ).join('|'),
    'g'
  )
}
/** Reuse MatchesRowFilterCreator for this case */
/** 
 * Build Detect Potential Matches on a Column for an array of gem types
 * With swappable gem is on the row on the right
 */
function RegexPotentialMatchesCol(number_of_cols, types) {
  var distance = RegExDistance(number_of_cols),
    distance1 = RegExDistance(number_of_cols - 1),
    distance2 = RegExDistance(number_of_cols - 1),
    distance3 = RegExDistance(number_of_cols - 1);
  
  return new RegExp(
    types.map(
      /** Expression for each type `T` */
      function(T) {
        return [
          [      T, distance1, T, distance,  T ].join(''),
          [      T, distance,  T, distance2, T ].join(''),
          [ '.', T, distance2, T, distance1, T ].join('')
        ].join('|')
      }
    ).join('|'),
    'g'
  );
}
/**

 * http://bit.ly/2laynF5

function PotentialMatchesColFilterCreator(number_of_cols) {

    var distance_to_EOR = number_of_cols - match.index % number_of_cols;
    /** Rerturn true if match index is more than 1 cells from the end of row */
    return distance_to_EOR > 1;
  }
}

function detectMatches(grid_size) {
  /** Regex for detecting matches */
  const regExMatchesRow = RegExMatchesRow(types);
  const regExMatchesCol = RegExMatchesCol(grid_size, types);
  /** Filter for rejecting false matches */
  const matchesRowFilter = MatchesRowFilterCreator(grid_size);

  const extractIndicesMatchesRow = ExtractIndicesMatchesRow;
  const extractIndicesMatchesCol = ExtractIndicesMatchesColCreator(grid_size);
  return([regExMatchesRow,regExMatchesCol,regexPotentialMatchesRow,regexPotentialMatchesCol])
}

			function transformPlt(e) {
				if ((e.spec.transform.count ?? 0) == 0) {
					for (const [key, value] of Object.entries(e.spec.transform)) {
						if (key != "count" && key != "repeat") {
							e[key] = value
						}
					}
					if (e.spec.transformSpec) for (const [key, value] of Object.entries(e.spec.transformSpec)) {
						e.spec[key] = value
					}
					if (e.spec.transformSpecMod) for (const [key, value] of Object.entries(e.spec.transformSpecMod)) {
						e.spec[key] += value
					}
					if (e.spec.transformSpecMul) for (const [key, value] of Object.entries(e.spec.transformSpecMul)) {
						e.spec[key] *= value
					}
				} else {
					if (e.spec.transform.repeat) {
						e.spec.transform.repeat--
						for (const [key, value] of Object.entries(e.spec.transform)) {
							if (key != "count" && key != "repeat") {
								e[key] = value
							}
						}
						if (e.spec.transformSpec) for (const [key, value] of Object.entries(e.spec.transformSpec)) {
							e.spec[key] = value
						}
						if (e.spec.transformSpecMod) for (const [key, value] of Object.entries(e.spec.transformSpecMod)) {
							e.spec[key] += value
						}
						if (e.spec.transformSpecMul) for (const [key, value] of Object.entries(e.spec.transformSpecMul)) {
							e.spec[key] *= value
						}
						if (e.spec.transform.repeat == 0 && e.spec.transformAft) for (const [key, value] of Object.entries(e.spec.transformAft)) {
							e[key] = value
						}
					} else e.spec.transform.count -= 1
				}
			}

			function convey() {
				if (selected.length < SeedC && cBelt.plants.length != 0 && (lim > 0 || MinigameA != 1 || MinigameB != 2)) {
					if ((cBelt.guaranteed ?? []).length <= convind) {
						let pool = []
						cBelt.plants.forEach((e,ee) => {
							if ((MinigameA == 1 && MinigameB == 2) || lim[ee] > 0 || lim[ee] == undefined) {
								if (selected.filter(ee => ee == e).length >= 4) {
									pool.push(...Array(5).fill([e,ee]))
								} else if (lastPlant == e) {
									pool.push(...Array(Math.floor(50*(cBelt.chances[ee]/100))).fill([e,ee]))
								} else {
									pool.push(...Array(Math.floor(100*(cBelt.chances[ee]/100))).fill([e,ee]))
								}
							}
						})
						//Debug.innerHTML = pool.filter(e => e==2).length+","+pool.filter(e => e==3).length
						const sellld = pool[Math.floor(Math.random()*pool.length)]
						const ind = sellld[1]
						lastPlant = sellld[0]
						if (MinigameA == 1 && MinigameB == 2) {
							if (ind != 1 && ind != 5) lim--
						} else if (lim[ind] != undefined) lim[ind]--
						selected.push(lastPlant)
					} else {
						selected.push(cBelt.guaranteed[convind])
					}
					convind++
					seeds.innerHTML = ""
					reloadSeed()
				}
				setTimeout(convey,MinigameA == 1 && MinigameB == 2 ? 0 : (4000+(selected.length > 2 ? 500 : 0))) //Idk man I searched for an entire day and didn't find an answer. I tried measuring it manually and it was very inconsistent because of human error so I'm guessing half a second which is so inconsequential that I don't even know why I'm adding it
