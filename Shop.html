<!doctype HTML>
<html>
	<head>
		<script>
			addEventListener("error", (e) => {
				alert(e.lineno+": "+e.message)+"\nShop"
			});
		</script>
		<meta charset="UTF-8">
		<title>Crazy Dave's shop</title>
		<style>
			button.seed {
				position: absolute;
				top: 0px;
				height: 110px;
				width: 98.75px;
				background-color: #CAF9E8;
				border-color: #8EBB9A;
				border-width: 5px;
				border-top-width: 20px;
			}
			button {
				margin: 0px;
				padding: 0px;
				display: inline-block;
			}
		</style>
	</head>
	<body id="body">
		<script src="./Definitions.js"></script>
		<div id="shopCont"></div>
		<e id="money">Temporarily disabled</e>
		<script>
			money.innerHTML = "$"+(localStorage.getItem("money") ?? 0)
			purchaseables = [{"valid":true,"cost":750,"change":"SeedC","req":6,"set":7,"name":"Seed slot 7"},{"cost":5000,"change":"SeedC","valid":true,"req":7,"set":8,"name":"Seed slot 8"},{"cost":20000,"change":"SeedC","valid":true,"req":8,"set":9,"name":"Seed slot 9"},{"cost":80000,"change":"SeedC","valid":true,"req":9,"set":10,"name":"Seed slot 10"}]
			purchaseables.forEach((e,ee) => { /*if (SeedC < 9) {*/
				if (e.valid && ((e.set != undefined && eval(e.change) == e.req) || (e.app != undefined && !eval(e.change).includes(e.app)))) shopCont.insertAdjacentHTML("beforeend","<button onclick='buy("+ee+")'>"+e.name+"<br>$"+e.cost+"</button>")
			})
			function buy(e) {
				if (purchaseables[e].cost <= (localStorage.getItem("money") ?? 0)) {
					localStorage.setItem("money",(localStorage.getItem("money") ?? 0)-purchaseables[e].cost)
					if (purchaseables[e].set != undefined) localStorage.setItem(purchaseables[e].change,purchaseables[e].set)
					else {
						eval(purchaseables[e].change).push(purchaseables[e].app)
						localStorage.setItem(purchaseables[e].change,eval(purchaseables[e].change))
					}
					location.reload()
				}
			}
		</script>
	</body>
</html>
