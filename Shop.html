	<body id="body">
		<a id="returnn" href="./index.html">Return</a>
		<script src="./Definitions.js"></script>

		<e id="money">Temporarily disabled</e>
		<script>
			//localStorage.setItem("money",Number(localStorage.getItem("money"))+1000)
			//localStorage.removeItem("shop")
			//alert(shop)
			//alert(typeof shop)
			//alert(JSON.stringify(shop))
			money.innerHTML = "$"+(localStorage.getItem("money") ?? 0)
			purchaseables = [{"valid":true,"cost":750,"change":"SeedC","req":6,"set":7,"name":"Seed slot 7"},{"cost":5000,"change":"SeedC","valid":true,"req":7,"set":8,"name":"Seed slot 8"},{"cost":20000,"change":"SeedC","valid":true,"req":8,"set":9,"name":"Seed slot 9"},{"cost":80000,"change":"SeedC","valid":true,"req":9,"set":10,"name":"Seed slot 10"},{"cost":1000,"change":"shop","ind":"pclean","valid":true,"req":undefined,"set":true,"name":"Pool Cleaners"},{"cost":3000,"change":"shop","ind":"rclean","valid":LevsUnlocked.includes(41),"req":undefined,"set":true,"name":"Roof Cleaners"},{"cost":5000,"change":"Unlocked","valid":true,"app":40,"name":"Gatling Pea"},{"cost":5000,"change":"Unlocked","valid":true,"app":41,"name":"Twin Sunflower"},{"cost":7500,"change":"Unlocked","valid":LevsUnlocked.includes(34),"app":42,"name":"Gloom Shroom"},{"cost":10000,"change":"Unlocked","valid":LevsUnlocked.includes(34),"app":43,"name":"Cattail"},{"cost":10000,"change":"Unlocked","valid":LevsUnlocked.includes(40),"app":44,"name":"Winter Melon"},{"cost":5000,"change":"Unlocked","valid":LevsUnlocked.includes(40),"app":45,"name":"Water Pot"},{"cost":7500,"change":"Unlocked","valid":LevsUnlocked.includes(54),"app":46,"name":"Spikerock"},{"cost":3000,"change":"Unlocked","valid":LevsUnlocked.includes(54),"app":47,"name":"Sun Magnet"},{"cost":5000,"change":"shop","ind":"sbclean","valid":LevsUnlocked.includes(61),"req":undefined,"set":true,"name":"Springboard Lawnmower"},{"cost":7000,"change":"shop","ind":"aclean","valid":LevsUnlocked.includes(81),"req":undefined,"set":true,"name":"Amphibious Lawnmowers"},{"cost":10000,"change":"shop","ind":"gcan","valid":LevsUnlocked.includes(44),"req":undefined,"set":true,"name":"Golden Watering Can (3x3)"},{"cost":25000,"change":"shop","ind":"dcan","valid":LevsUnlocked.includes(44) && shop.gcan,"req":undefined,"set":true,"name":"Diamond Watering Can (5x5)"},{"cost":10000,"change":"shop","ind":"gfert","valid":LevsUnlocked.includes(44),"req":undefined,"set":true,"name":"Golden Fertiliser (3x3)"},{"cost":25000,"change":"shop","ind":"dfert","valid":LevsUnlocked.includes(44) && shop.gfert,"req":undefined,"set":true,"name":"Diamond Fertiliser (5x5)"},{"cost":750000,"change":"shop","ind":"mini","valid":true,"req":undefined,"set":true,"name":"Unlock most minigames"},{"cost":10000,"change":"shop","ind":"initSun","valid":LevsUnlocked.includes(94),"req":undefined,"set":75,"name":"Starting sun +25"},{"cost":500000,"change":"shop","ind":"sellAll","valid":LevsUnlocked.includes(84),"req":undefined,"set":true,"name":"Zen garden sell all full grown button"}]
			if (!localStorage.getItem("shop")) localStorage.setItem("shop","{}")
			purchaseables.forEach((e,ee) => { /*if (SeedC < 9) {*/
				//if (e.valid && ((e.set != undefined && (e.ind ? JSON.parse(localStorage.getItem(e.change))[e.ind] : JSON.parse(localStorage.getItem(e.change)) == e.req) || (e.app != undefined && !JSON.parse(localStorage.getItem(e.change)).includes(e.app)))) shopCont.insertAdjacentHTML("beforeend","<button onclick='buy("+ee+")'>"+e.name+"<br>$"+e.cost+"</button>")
				if (e.valid && ((e.set != undefined && (e.ind ? JSON.parse(localStorage.getItem(e.change))[e.ind] : JSON.parse(localStorage.getItem(e.change))) == e.req) || (e.app != undefined && !JSON.parse(localStorage.getItem(e.change)).includes(e.app)))) shopCont.insertAdjacentHTML("beforeend","<button onclick='buy("+ee+")'>"+e.name+"<br>$"+e.cost+"</button>")
			})
			function buy(e) {
				if (purchaseables[e].cost <= (localStorage.getItem("money") ?? 0)) {
					localStorage.setItem("money",Number(localStorage.getItem("money") ?? 0)-purchaseables[e].cost)
					if (purchaseables[e].set != undefined) {
						if (purchaseables[e].ind) {
							let t = JSON.parse(localStorage.getItem(purchaseables[e].change))
							t[purchaseables[e].ind] = purchaseables[e].set
							localStorage.setItem(purchaseables[e].change,JSON.stringify(t))
						} else localStorage.setItem(purchaseables[e].change,purchaseables[e].set)
					} else {
						let t = JSON.parse(localStorage.getItem(purchaseables[e].change))
						if (!t.includes(purchaseables[e].app)) {
							t.push(purchaseables[e].app)
							localStorage.setItem(purchaseables[e].change,JSON.stringify(t))
						}
						if (purchaseables[e].change == "Unlocked") {
							unlocked = JSON.parse(localStorage.getItem("Unlocked"))
							let t = []
							let t2 = [...unlocked]
							unlocked.forEach(() => {
								t.push(Math.min(...t2))
								t2.splice(t2.indexOf(t[t.length-1]),1)
							})
							unlocked = t
							localStorage.setItem("Unlocked",JSON.stringify(unlocked))
						}
					}
					location.reload()
				}
			}
		</script>
